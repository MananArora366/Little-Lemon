{% extends 'base.html' %}

    <h1 style="font-size: 4rem; color: #F4CE14; margin-bottom: 0.5rem;">404</h1>
    <h2 style="font-size: 1.6rem; color: #EE9972; margin-bottom: 1.5rem;">Oops! Page or Dish Not Found</h2>

    </p>
    <a href="{% url 'restaurant:index' %}" class="btn">Back to Home</a>
</div>
{% endblock %}
