{% extends 'base.html' %}
{% block content %}
<h1 style="color: #F4CE14; margin-bottom: 2rem;">Our Menu</h1>
<div class="menu-grid">
    {% for item in menu_items %}
    <div class="menu-card">
        <a href="{% url 'restaurant:web-menu-item' item.pk %}" style="text-decoration: none; color: inherit;">
            <h3>{{ item.title }}</h3>
        </a>
        <p style="font-size: 1.2rem; margin-bottom: 0.5rem;">${{ item.price }}</p>
        <p style="font-size: 0.9rem; color: #bbb;">Available: {{ item.inventory }}</p>
    </div>
    {% empty %}
    <p style="text-align: center; color: #EDEFEE; font-size: 1.1rem; grid-column: 1 / -1;">No items on the menu yet.</p>
    {% endfor %}
</div>
{% endblock %}
