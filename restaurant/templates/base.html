<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Lemon Restaurant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #495E57; color: #EDEFEE; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: #333333; padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #F4CE14; }
        .logo { font-size: 1.8rem; font-weight: 800; color: #F4CE14; letter-spacing: 1px; }
        .logo span { color: #EE9972; }
        nav a { color: #EDEFEE; text-decoration: none; margin-left: 1.5rem; font-weight: 600; transition: color 0.2s; }
        nav a:hover { color: #F4CE14; }
        main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 3rem 1.5rem; text-align: center; }
        footer { background: #333333; text-align: center; padding: 1.2rem; font-size: 0.9rem; color: #888; border-top: 1px solid rgba(255,255,255,0.1); margin-top: auto; }
        /* Forms */
        form { background: rgba(0,0,0,0.25); padding: 2rem; border-radius: 12px; max-width: 500px; width: 100%; text-align: left; }
        .form-control { width: 100%; padding: 0.8rem; margin-top: 0.5rem; margin-bottom: 1.5rem; border-radius: 6px; border: 1px solid #ccc; font-family: inherit; }
        .btn { background: #F4CE14; color: #333333; padding: 0.8rem 1.8rem; border-radius: 8px; font-weight: 700; text-decoration: none; border: none; cursor: pointer; transition: transform 0.2s, background 0.2s; display: inline-block;}
        .btn:hover { background: #EE9972; color: #fff; transform: translateY(-2px); }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 2rem; width: 100%; max-width: 1000px; }
        .menu-card { background: rgba(255,255,255,0.1); padding: 1.5rem; border-radius: 8px; border: 1px solid #F4CE14; }
        .menu-card h3 { color: #F4CE14; margin-bottom: 0.5rem; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <div class="logo">Little <span>Lemon</span></div>
        <nav>
            <a href="{% url 'restaurant:index' %}">Home</a>
            <a href="{% url 'restaurant:web-menu' %}">Web Menu</a>
            <a href="{% url 'restaurant:web-book' %}">Web Book</a>
            <a href="{% url 'restaurant:menu-list' %}">API Menu</a>
            <a href="{% url 'admin:index' %}">Admin</a>
        </nav>
    </header>
    <main>
        {% if messages %}
            <div style="max-width: 700px; margin: 1rem auto; padding: 1rem; background: #F4CE14; color: #333333; border-radius: 8px; font-weight: bold; text-align: center;">
                {% for m in messages %}
                    <p class="msg">{{ m }}</p>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}
        {% endblock %}
    </main>
    <footer>
        &copy; 2026 Little Lemon Restaurant. Built with Django.
    </footer>
</body>
</html>
